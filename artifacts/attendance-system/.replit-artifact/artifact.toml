kind = "web"
previewPath = "/"
title = "Student Attendance System"
description = "A web app for teachers to organize classes and timed lectures, and for students to mark attendance within teacher-defined windows."
version = "1.0.0"
id = "artifacts/attendance-system"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24620

[services.development]
run = "pnpm --filter @workspace/attendance-system run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/attendance-system", "run", "build" ]
serve = "static"
publicDir = "artifacts/attendance-system/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24620"
BASE_PATH = "/"
